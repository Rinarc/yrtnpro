<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>渊华德招考网 · 服务入口</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #f0f4f8;
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            background-image: radial-gradient(circle at 20% 30%, rgba(10, 30, 61, 0.03) 0%, transparent 60%);
        }

        /* ===== 水印背景 ===== */
        #watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><text x="50%" y="50%" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="%23000" transform="rotate(-25, 100, 100)" text-anchor="middle" dominant-baseline="central">渊华德教育考试院</text></svg>');
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== 主卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(10, 30, 61, 0.18);
            padding: 40px 36px 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }

        /* ===== Logo 区域 ===== */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
            border-bottom: 2px solid #eef2f6;
            padding-bottom: 20px;
        }
        .brand .logo {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }
        .brand .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .brand .title {
            font-size: 26px;
            font-weight: 700;
            color: #0a1e3d;
            letter-spacing: 3px;
        }
        .brand .title span {
            color: #c9a84c;
        }

        /* ===== 欢迎标题 ===== */
        .welcome {
            text-align: center;
            margin-bottom: 32px;
        }
        .welcome h1 {
            font-size: 24px;
            font-weight: 600;
            color: #0a1e3d;
            letter-spacing: 2px;
        }
        .welcome h1 i {
            color: #c9a84c;
            margin-right: 8px;
        }
        .welcome .sub {
            color: #6f7f8f;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== 入口卡片 ===== */
        .entry-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
        }

        .entry-card {
            display: flex;
            align-items: center;
            background: #f8faff;
            border-radius: 12px;
            padding: 18px 24px;
            border-left: 5px solid #c9a84c;
            transition: 0.25s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            text-decoration: none;
            color: #1a2a3a;
        }
        .entry-card:hover {
            transform: translateX(6px);
            box-shadow: 0 6px 20px rgba(10, 30, 61, 0.12);
            background: #ffffff;
        }
        .entry-card .icon-wrap {
            width: 48px;
            height: 48px;
            background: #0a1e3d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #c9a84c;
            flex-shrink: 0;
            margin-right: 18px;
        }
        .entry-card .info {
            flex: 1;
        }
        .entry-card .info .main-text {
            font-size: 17px;
            font-weight: 600;
            color: #0a1e3d;
            letter-spacing: 0.5px;
        }
        .entry-card .info .sub-text {
            font-size: 13px;
            color: #6f7f8f;
            margin-top: 2px;
        }
        .entry-card .arrow {
            font-size: 22px;
            color: #bcc8d6;
            transition: 0.25s;
            flex-shrink: 0;
        }
        .entry-card:hover .arrow {
            color: #c9a84c;
            transform: translateX(4px);
        }

        /* 第二行（录取查询）卡片左侧颜色不同 */
        .entry-card.lq {
            border-left-color: #2a5a8a;
        }
        .entry-card.lq .icon-wrap {
            background: #2a5a8a;
            color: #fff;
        }

        /* ===== 底部信息 ===== */
        .footer-info {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eef2f6;
            font-size: 13px;
            color: #99aabb;
        }
        .footer-info .browsers {
            margin: 8px 0 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer-info .browsers span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #556677;
        }
        .footer-info .browsers i {
            font-size: 16px;
        }
        .footer-info .copyright {
            letter-spacing: 0.5px;
        }
        .footer-info .copyright a {
            color: #0a1e3d;
            text-decoration: none;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .card {
                padding: 24px 16px 20px;
            }
            .brand .title {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .brand .logo {
                width: 44px;
                height: 44px;
            }
            .welcome h1 {
                font-size: 20px;
            }
            .entry-card {
                padding: 14px 16px;
            }
            .entry-card .icon-wrap {
                width: 40px;
                height: 40px;
                font-size: 18px;
                margin-right: 12px;
            }
            .entry-card .info .main-text {
                font-size: 15px;
            }
            .entry-card .info .sub-text {
                font-size: 12px;
            }
            .footer-info .browsers {
                gap: 12px;
            }
        }

        @media (max-width: 400px) {
            .brand {
                flex-direction: column;
                gap: 8px;
            }
            .brand .title {
                font-size: 18px;
            }
            .entry-card {
                flex-wrap: wrap;
            }
            .entry-card .arrow {
                margin-left: auto;
            }
        }

        /* ===== 打印 ===== */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            #watermark {
                opacity: 0.02;
            }
            .entry-card:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <!-- 水印背景 -->
    <div id="watermark"></div>

    <div class="container">
        <div class="card">

            <!-- 品牌 Logo + 名称 -->
            <div class="brand">
                <div class="logo">
                    <img src="https://origin.picgo.net/2026/08/01/knockout936cb79c3e8cffa7.png" alt="渊华德招考网" />
                </div>
                <div class="title">渊华德<span>招考网</span></div>
            </div>

            <!-- 欢迎语 -->
            <div class="welcome">
                <h1><i class="fas fa-graduation-cap"></i> 欢迎访问渊华德招考热线</h1>
                <div class="sub">权威发布 · 一站式服务</div>
            </div>

            <!-- 入口卡片 -->
            <div class="entry-grid">
                <!-- 成绩查询入口 -->
                <a href="service-yhdmeea-cjcx.html" class="entry-card">
                    <div class="icon-wrap"><i class="fas fa-file-alt"></i></div>
                    <div class="info">
                        <div class="main-text">2026年渊迂市初中学业水平考试成绩查询</div>
                        <div class="sub-text">点击进入成绩查询系统</div>
                    </div>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>

                <!-- 录取查询入口 -->
                <a href="service-yhdmeea-lqcx.html" class="entry-card lq">
                    <div class="icon-wrap"><i class="fas fa-trophy"></i></div>
                    <div class="info">
                        <div class="main-text">2026年渊迂市普通高等学校招生录取查询</div>
                        <div class="sub-text">点击进入录取结果查询</div>
                    </div>
                    <span class="arrow"><i class="fas fa-chevron-right"></i></span>
                </a>
            </div>

            <!-- 底部信息 -->
            <div class="footer-info">
                <div class="browsers">
                    <span><i class="fab fa-chrome"></i> Chrome（谷歌浏览器）</span>
                    <span><i class="fab fa-firefox-browser"></i> Firefox 火狐浏览器</span>
                </div>
                <div class="copyright">
                    © 2026 <a href="#">渊华德教育考试院</a> 
                </div>
            </div>

        </div>
    </div>

    <!-- 简单的交互（可选） -->
    <script>
        // 所有入口卡片点击跳转已在 href 中定义，无需额外逻辑
        console.log('渊华德招考网 · 服务入口已加载');
    </script>
</body>
</html>
