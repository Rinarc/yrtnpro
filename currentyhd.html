<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渊华德这一刻 | YRTN+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ---- 与主页一致的样式 ---- */
        :root {
            --primary: #FF3E4D;
            --secondary: #4A90E2;
            --accent: #FFD166;
            --dark: #1A1A2E;
            --light: #F8F9FA;
            --success: #06D6A0;
            --gradient-primary: linear-gradient(135deg, #FF3E4D 0%, #FF6B6B 100%);
            --gradient-secondary: linear-gradient(135deg, #4A90E2 0%, #5F72BE 100%);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.16);
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-fast: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 90px;
        }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.4rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand i { color: var(--primary); font-size: 1.5rem; }
        .user-area { display: flex; align-items: center; gap: 15px; }
        .user-area .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .user-area .logout {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 30px;
            transition: var(--transition-fast);
        }
        .user-area .logout:hover { background: rgba(255,62,77,0.1); }
        .container { max-width: 720px; margin: 0 auto; padding: 20px; }
        .post-form {
            background: white;
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: var(--transition);
        }
        .post-form:hover { box-shadow: var(--shadow-md); }
        .post-form .form-group { margin-bottom: 18px; }
        .post-form label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #555;
        }
        .post-form input, .post-form textarea, .post-form select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition-fast);
            background: #fafafa;
        }
        .post-form input:focus, .post-form textarea:focus, .post-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,62,77,0.15);
            background: white;
        }
        .post-form textarea { resize: vertical; min-height: 90px; }
        .char-counter { text-align: right; font-size: 0.8rem; color: #999; margin-top: 4px; }
        .post-form .btn-publish {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(255,62,77,0.3);
        }
        .post-form .btn-publish:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255,62,77,0.4);
        }
        .sort-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            padding-bottom: 12px;
        }
        .sort-bar button {
            background: none;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            color: #888;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sort-bar button.active {
            color: var(--primary);
            background: rgba(255,62,77,0.08);
        }
        .sort-bar button:hover { color: var(--primary); }
        .post-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.05);
            transition: var(--transition);
            animation: fadeUp 0.5s ease forwards;
        }
        .post-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gradient-secondary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
            flex-shrink: 0;
        }
        .post-identity {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .post-identity small {
            font-weight: 400;
            color: #888;
            font-size: 0.8rem;
            margin-left: 8px;
        }
        .post-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .post-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #333;
            margin-bottom: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 14px 0;
        }
        .post-images img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-sm);
        }
        .post-images img:hover { transform: scale(1.04); box-shadow: var(--shadow-md); }
        .post-video {
            margin: 14px 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #000;
            box-shadow: var(--shadow-sm);
        }
        .post-video video { width: 100%; display: block; max-height: 400px; }
        .post-actions {
            display: flex;
            gap: 20px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.06);
            align-items: center;
            flex-wrap: wrap;
        }
        .post-actions button {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #666;
            cursor: pointer;
            transition: var(--transition-fast);
            padding: 6px 12px;
            border-radius: 30px;
        }
        .post-actions button:hover { background: rgba(0,0,0,0.04); color: var(--primary); }
        .post-actions .liked { color: var(--primary); }
        .post-actions .liked i { font-weight: 900; }
        .post-actions .comment-toggle { margin-left: auto; }
        .comments-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: none;
            animation: slideDown 0.3s ease;
        }
        .comments-section.open { display: block; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .comment-item {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .comment-item .c-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gradient-secondary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .comment-item .c-content { font-size: 0.95rem; color: #333; word-break: break-word; }
        .comment-item .c-meta { font-size: 0.75rem; color: #999; margin-left: 6px; }
        .comment-form-input {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .comment-form-input input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }
        .comment-form-input input:focus { outline: none; border-color: var(--primary); }
        .comment-form-input button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }
        .comment-form-input button:hover { background: #e63e4d; transform: scale(1.02); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state i { font-size: 4rem; color: #ddd; margin-bottom: 15px; }
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .image-modal.active { display: flex; }
        .image-modal img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .image-modal .close {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            transition: var(--transition-fast);
            opacity: 0.8;
        }
        .image-modal .close:hover { opacity: 1; transform: rotate(90deg); }
        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 30px;
            color: #999;
        }
        .loading-spinner i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .error-box {
            background: #fff0f0;
            border-left: 4px solid var(--primary);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            color: #b91c1c;
            margin: 20px 0;
        }
        .no-posts { color: #bbb; }
        @media (max-width: 600px) {
            .container { padding: 15px; }
            .post-images { grid-template-columns: repeat(2, 1fr); }
            .post-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="brand"><i class="fas fa-bolt"></i> 渊华德·这一刻</div>
        <div class="user-area" id="userArea">
            <span id="userDisplay" style="font-weight:500;"></span>
            <button class="logout" id="logoutBtn" style="display:none;">退出</button>
        </div>
    </header>
    <div class="container" id="app">
        <!-- 发帖表单 -->
        <div class="post-form" id="postForm" style="display:none;">
            <h3 style="margin-bottom:16px; font-size:1.3rem;">📝 发布动态</h3>
            <div class="form-group">
                <label>发帖身份</label>
                <select id="identitySelect"></select>
            </div>
            <div class="form-group">
                <label>标题（可选）</label>
                <input type="text" id="postTitle" placeholder="给动态一个标题..." maxlength="100">
            </div>
            <div class="form-group">
                <label>内容 *（限300字）</label>
                <textarea id="postContent" placeholder="分享这一刻..." maxlength="300"></textarea>
                <div class="char-counter"><span id="charCount">0</span>/300</div>
            </div>
            <div class="form-group">
                <label>图片链接（多个用英文逗号分隔）</label>
                <input type="text" id="postImages" placeholder="https://example.com/img1.jpg, https://example.com/img2.jpg">
            </div>
            <div class="form-group">
                <label>视频链接（可选）</label>
                <input type="text" id="postVideo" placeholder="https://example.com/video.mp4">
            </div>
            <button class="btn-publish" id="publishBtn"><i class="fas fa-pen"></i> 发布</button>
        </div>
        <!-- 排序 -->
        <div class="sort-bar">
            <button class="active" data-sort="latest"><i class="fas fa-clock"></i> 最新</button>
            <button data-sort="hot"><i class="fas fa-fire"></i> 最热</button>
        </div>
        <!-- 帖子列表 -->
        <div id="postsContainer"><div class="loading-spinner"><i class="fas fa-spinner"></i></div></div>
    </div>

    <!-- 图片查看模态框 -->
    <div class="image-modal" id="imageModal">
        <span class="close" id="closeModal">&times;</span>
        <img id="modalImg" src="" alt="大图">
    </div>

    <script>
        // ===== Supabase 配置 =====
        const SUPABASE_URL = 'https://uslzixbrazwuvrjhdgxy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzbHppeGJyYXp3dXZyamhkZ3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODExMDUsImV4cCI6MjA5Mjk1NzEwNX0.xiCB3qA3cciJRutHrv4DRi-hBvAQOiJRXhEmQA7TlmA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let identities = [];
        let currentSort = 'latest';
        let posts = [];

        const userDisplay = document.getElementById('userDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');
        const identitySelect = document.getElementById('identitySelect');
        const postTitle = document.getElementById('postTitle');
        const postContent = document.getElementById('postContent');
        const postImages = document.getElementById('postImages');
        const postVideo = document.getElementById('postVideo');
        const publishBtn = document.getElementById('publishBtn');
        const postsContainer = document.getElementById('postsContainer');
        const sortBtns = document.querySelectorAll('.sort-bar button');
        const charCount = document.getElementById('charCount');
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');

        // ===== 辅助 =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }
        function formatTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ===== 检查登录 =====
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                const { data: profile } = await supabase.from('profiles').select('username').eq('id', user.id).single();
                const name = profile?.username || user.email?.split('@')[0] || '用户';
                userDisplay.textContent = name;
                logoutBtn.style.display = 'inline';
                await loadIdentities();
                postForm.style.display = 'block';
            } else {
                userDisplay.textContent = '未登录';
                logoutBtn.style.display = 'none';
                postForm.style.display = 'none';
                postsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sign-in-alt"></i>
                        <p>请 <a href="login.html" style="color:var(--primary);font-weight:600;">登录</a> 后参与互动</p>
                    </div>
                `;
            }
        }

        // ===== 加载身份 =====
        async function loadIdentities() {
            if (!currentUser) return;
            const { data, error } = await supabase
                .from('identities')
                .select('*')
                .eq('user_id', currentUser.id);
            if (error) {
                console.error('加载身份失败', error);
                identitySelect.innerHTML = `<option value="">加载失败，请刷新</option>`;
                return;
            }
            identities = data || [];
            if (identities.length === 0) {
                identitySelect.innerHTML = `<option value="">暂无身份，请联系管理员添加</option>`;
            } else {
                identitySelect.innerHTML = identities.map(id => `<option value="${id.id}">${id.display_name}</option>`).join('');
            }
        }

        // ===== 发布帖子 =====
        async function publishPost() {
            if (!currentUser) { alert('请先登录'); return; }
            const identityId = identitySelect.value;
            if (!identityId) { alert('请选择发帖身份'); return; }
            const title = postTitle.value.trim();
            const content = postContent.value.trim();
            if (!content) { alert('请输入内容'); return; }
            if (content.length > 300) { alert('内容不能超过300字'); return; }
            const images = postImages.value.trim().split(',').map(s => s.trim()).filter(Boolean);
            const video = postVideo.value.trim();

            const { data, error } = await supabase
                .from('posts')
                .insert({
                    user_id: currentUser.id,
                    identity_id: parseInt(identityId),
                    title: title,
                    content: content,
                    images: images.length ? images.join(',') : null,
                    video_url: video || null,
                })
                .select();
            if (error) {
                alert('发布失败: ' + error.message);
                return;
            }
            postTitle.value = '';
            postContent.value = '';
            postImages.value = '';
            postVideo.value = '';
            charCount.textContent = '0';
            loadPosts();
        }

        // ===== 加载帖子（修复版） =====
        async function loadPosts() {
            postsContainer.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner"></i></div>';
            try {
                const order = currentSort === 'latest' ? 'created_at' : 'likes_count';
                // 先查帖子
                const { data, error } = await supabase
                    .from('posts')
                    .select(`
                        *,
                        identities (display_name, avatar_url)
                    `)
                    .order(order, { ascending: false });
                if (error) throw error;
                posts = data || [];

                // 如果用户已登录，批量查询点赞状态
                let likedMap = {};
                if (currentUser && posts.length > 0) {
                    const postIds = posts.map(p => p.id);
                    const { data: likes, error: likeErr } = await supabase
                        .from('post_likes')
                        .select('post_id')
                        .eq('user_id', currentUser.id)
                        .in('post_id', postIds);
                    if (!likeErr && likes) {
                        likedMap = likes.reduce((acc, l) => { acc[l.post_id] = true; return acc; }, {});
                    }
                }
                // 为每个帖子附加点赞状态
                posts = posts.map(p => ({ ...p, userLiked: likedMap[p.id] || false }));
                renderPosts();
            } catch (err) {
                console.error('加载帖子失败:', err);
                postsContainer.innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-exclamation-circle"></i> 加载失败：${err.message}
                        <br><button onclick="loadPosts()" style="margin-top:10px;padding:6px 16px;background:var(--primary);color:white;border:none;border-radius:30px;cursor:pointer;">重试</button>
                    </div>
                `;
            }
        }

        // ===== 渲染帖子 =====
        function renderPosts() {
            if (!posts.length) {
                postsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-comment"></i><p>还没有动态，快来发布第一条吧！</p></div>`;
                return;
            }
            let html = '';
            posts.forEach(post => {
                const identity = post.identities || { display_name: '未知', avatar_url: null };
                const avatarLetter = identity.display_name.charAt(0).toUpperCase();
                const hasLiked = post.userLiked || false;
                const images = post.images ? post.images.split(',').filter(Boolean) : [];
                const videoUrl = post.video_url;

                html += `
                    <div class="post-card" data-post-id="${post.id}">
                        <div class="post-header">
                            <div class="post-avatar" style="${identity.avatar_url ? `background-image:url(${identity.avatar_url});background-size:cover;background-position:center;` : ''}">${identity.avatar_url ? '' : avatarLetter}</div>
                            <div>
                                <div class="post-identity">${escapeHtml(identity.display_name)} <small>${formatTime(post.created_at)}</small></div>
                            </div>
                        </div>
                        ${post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : ''}
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        ${images.length ? `<div class="post-images">${images.map(img => `<img src="${escapeHtml(img)}" loading="lazy" onclick="openModal('${escapeHtml(img)}')">`).join('')}</div>` : ''}
                        ${videoUrl ? `<div class="post-video"><video controls src="${escapeHtml(videoUrl)}"></video></div>` : ''}
                        <div class="post-actions">
                            <button class="like-btn ${hasLiked ? 'liked' : ''}" data-post-id="${post.id}">
                                <i class="fas fa-heart"></i> <span class="like-count">${post.likes_count || 0}</span>
                            </button>
                            <button class="comment-toggle" data-post-id="${post.id}">
                                <i class="fas fa-comment"></i> 评论
                            </button>
                            <button class="share-btn" data-post-id="${post.id}">
                                <i class="fas fa-share-alt"></i> 转发
                            </button>
                        </div>
                        <div class="comments-section" data-post-id="${post.id}">
                            <div class="comments-list"></div>
                            <div class="comment-form-input">
                                <input type="text" placeholder="写评论..." class="comment-input">
                                <button class="comment-submit" data-post-id="${post.id}">发表</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            postsContainer.innerHTML = html;
            // 事件绑定
            document.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', () => handleLike(btn)));
            document.querySelectorAll('.comment-toggle').forEach(btn => btn.addEventListener('click', () => toggleComments(btn)));
            document.querySelectorAll('.comment-submit').forEach(btn => btn.addEventListener('click', () => submitComment(btn)));
            document.querySelectorAll('.comment-input').forEach(inp => inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') inp.parentElement.querySelector('.comment-submit')?.click();
            }));
            document.querySelectorAll('.share-btn').forEach(btn => btn.addEventListener('click', () => sharePost(btn)));
        }

        // ===== 点赞 =====
        async function handleLike(btn) {
            if (!currentUser) { alert('请先登录'); return; }
            const postId = parseInt(btn.dataset.postId);
            const isLiked = btn.classList.contains('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent) || 0;
            try {
                if (isLiked) {
                    await supabase.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
                    btn.classList.remove('liked');
                    countSpan.textContent = count - 1;
                } else {
                    await supabase.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
                    btn.classList.add('liked');
                    countSpan.textContent = count + 1;
                }
            } catch (err) { alert('操作失败: ' + err.message); }
        }

        // ===== 评论展开/加载 =====
        async function toggleComments(btn) {
            const postId = btn.dataset.postId;
            const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
            if (section.classList.contains('open')) { section.classList.remove('open'); return; }
            section.classList.add('open');
            const list = section.querySelector('.comments-list');
            list.innerHTML = '<div class="loading-spinner" style="padding:10px;"><i class="fas fa-spinner"></i></div>';
            try {
                const { data, error } = await supabase
                    .from('post_comments')
                    .select('*, profiles(username)')
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true });
                if (error) throw error;
                if (!data.length) {
                    list.innerHTML = '<div style="color:#999;padding:8px 0;">暂无评论</div>';
                } else {
                    list.innerHTML = data.map(c => `
                        <div class="comment-item">
                            <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                            <div>
                                <span class="c-content">${escapeHtml(c.content)}</span>
                                <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { list.innerHTML = '<div style="color:#999;">加载失败</div>'; }
        }

        // ===== 提交评论 =====
        async function submitComment(btn) {
            if (!currentUser) { alert('请先登录'); return; }
            const postId = parseInt(btn.dataset.postId);
            const input = btn.parentElement.querySelector('.comment-input');
            const content = input.value.trim();
            if (!content) return;
            try {
                await supabase.from('post_comments').insert({ post_id: postId, user_id: currentUser.id, content });
                input.value = '';
                // 刷新评论列表
                const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
                const list = section.querySelector('.comments-list');
                const { data } = await supabase
                    .from('post_comments')
                    .select('*, profiles(username)')
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true });
                if (data) {
                    list.innerHTML = data.map(c => `
                        <div class="comment-item">
                            <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                            <div>
                                <span class="c-content">${escapeHtml(c.content)}</span>
                                <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { alert('评论失败: ' + err.message); }
        }

        // ===== 转发 =====
        function sharePost(btn) {
            const postId = btn.dataset.postId;
            const url = window.location.href + '?post=' + postId;
            if (navigator.share) navigator.share({ title: '分享动态', url });
            else navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
        }

        // ===== 图片查看大图 =====
        function openModal(src) {
            modalImg.src = src;
            imageModal.classList.add('active');
        }
        closeModal.addEventListener('click', () => imageModal.classList.remove('active'));
        imageModal.addEventListener('click', (e) => { if (e.target === imageModal) imageModal.classList.remove('active'); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') imageModal.classList.remove('active'); });

        // ===== 排序切换 =====
        sortBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sortBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                loadPosts();
            });
        });

        // ===== 字符计数 =====
        postContent.addEventListener('input', () => {
            charCount.textContent = postContent.value.length;
        });

        // ===== 发布按钮 =====
        publishBtn.addEventListener('click', publishPost);

        // ===== 退出 =====
        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            location.reload();
        });

        // ===== 启动 =====
        (async () => {
            await checkAuth();
            if (currentUser) {
                await loadPosts();
            } else {
                // 未登录仍然加载帖子（只读）
                await loadPosts();
            }
        })();
    </script>
</body>
</html>
