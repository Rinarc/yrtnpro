<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渊华德这一刻 | YRTN+</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #FF3E4D; --light: #f8f9fa; --dark: #1a1a2e; --shadow: 0 4px 12px rgba(0,0,0,0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--light); color: var(--dark); padding: 20px; }
        .container { max-width: 720px; margin: 0 auto; }
        .header { background: white; padding: 15px 20px; border-radius: 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-weight: 700; font-size: 1.4rem; background: linear-gradient(135deg, #FF3E4D, #4A90E2); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .user-area { display: flex; align-items: center; gap: 12px; }
        .logout { background: none; border: none; color: var(--primary); cursor: pointer; }
        .status-box { background: white; border-radius: 16px; padding: 15px 20px; margin-bottom: 20px; box-shadow: var(--shadow); border-left: 4px solid #4A90E2; font-size: 0.95rem; }
        .status-box.error { border-left-color: #FF3E4D; background: #fff5f5; }
        .status-box.success { border-left-color: #06D6A0; }
        .post-form { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; display: none; }
        .post-form .form-group { margin-bottom: 15px; }
        .post-form label { display: block; font-weight: 500; margin-bottom: 5px; }
        .post-form input, .post-form textarea, .post-form select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; }
        .post-form button { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .sort-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .sort-bar button { background: none; border: none; font-weight: 600; color: #888; padding: 6px 14px; cursor: pointer; }
        .sort-bar button.active { color: var(--primary); background: rgba(255,62,77,0.08); border-radius: 30px; }
        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 44px; height: 44px; border-radius: 50%; background: #4A90E2; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .post-identity { font-weight: 600; }
        .post-identity small { font-weight: 400; color: #888; font-size: 0.8rem; margin-left: 8px; }
        .post-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .post-content { font-size: 0.95rem; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        .post-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
        .post-images img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; cursor: pointer; }
        .post-actions { display: flex; gap: 20px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
        .post-actions button { background: none; border: none; display: flex; align-items: center; gap: 6px; color: #666; cursor: pointer; padding: 4px 10px; border-radius: 30px; }
        .post-actions .liked { color: var(--primary); }
        .comments-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: none; }
        .comments-section.open { display: block; }
        .comment-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .comment-item .c-avatar { width: 28px; height: 28px; border-radius: 50%; background: #4A90E2; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; flex-shrink: 0; }
        .comment-item .c-content { font-size: 0.9rem; color: #333; word-break: break-word; }
        .comment-item .c-meta { font-size: 0.75rem; color: #999; margin-left: 6px; }
        .comment-form-input { display: flex; gap: 10px; margin-top: 10px; }
        .comment-form-input input { flex: 1; padding: 8px 14px; border: 1px solid #ddd; border-radius: 30px; }
        .comment-form-input button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .empty-state { text-align: center; padding: 40px 0; color: #999; }
        .loading { text-align: center; padding: 30px; color: #999; }
        .loading i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .error-box { background: #fff0f0; border-left: 4px solid #FF3E4D; padding: 15px; border-radius: 12px; color: #b91c1c; margin: 15px 0; }
        .image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 10000; }
        .image-modal.active { display: flex; }
        .image-modal img { max-width: 90%; max-height: 90vh; object-fit: contain; }
        .image-modal .close { position: absolute; top: 30px; right: 30px; color: white; font-size: 2.5rem; cursor: pointer; }
        @media (max-width: 600px) { .container { padding: 10px; } }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="statusArea" class="status-box">⏳ 正在初始化...</div>

    <div class="header">
        <div class="brand"><i class="fas fa-bolt"></i> 渊华德·这一刻</div>
        <div class="user-area" id="userArea">
            <span id="userDisplay">未登录</span>
            <button class="logout" id="logoutBtn" style="display:none;">退出</button>
        </div>
    </div>

    <div class="post-form" id="postForm" style="display:none;">
        <h3 style="margin-bottom:15px;">📝 发布动态</h3>
        <div class="form-group">
            <label>发帖身份</label>
            <select id="identitySelect"></select>
        </div>
        <div class="form-group">
            <label>标题（可选）</label>
            <input type="text" id="postTitle" placeholder="标题" maxlength="100">
        </div>
        <div class="form-group">
            <label>内容 *（限300字）</label>
            <textarea id="postContent" placeholder="分享..." maxlength="300" rows="3"></textarea>
            <div style="text-align:right;font-size:0.8rem;color:#999;"><span id="charCount">0</span>/300</div>
        </div>
        <div class="form-group">
            <label>图片链接（逗号分隔）</label>
            <input type="text" id="postImages" placeholder="https://example.com/1.jpg, https://example.com/2.jpg">
        </div>
        <div class="form-group">
            <label>视频链接</label>
            <input type="text" id="postVideo" placeholder="https://example.com/video.mp4">
        </div>
        <button id="publishBtn"><i class="fas fa-pen"></i> 发布</button>
    </div>

    <div class="sort-bar">
        <button class="active" data-sort="latest"><i class="fas fa-clock"></i> 最新</button>
        <button data-sort="hot"><i class="fas fa-fire"></i> 最热</button>
    </div>

    <div id="postsContainer"><div class="loading"><i class="fas fa-spinner"></i> 加载中...</div></div>
</div>

<div class="image-modal" id="imageModal">
    <span class="close" id="closeModal">&times;</span>
    <img id="modalImg" src="" alt="大图">
</div>

<script>
    // ===== 配置 =====
    const SUPABASE_URL = 'https://uslzixbrazwuvrjhdgxy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzbHppeGJyYXp3dXZyamhkZ3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODExMDUsImV4cCI6MjA5Mjk1NzEwNX0.xiCB3qA3cciJRutHrv4DRi-hBvAQOiJRXhEmQA7TlmA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== DOM 引用 =====
    const statusArea = document.getElementById('statusArea');
    const postsContainer = document.getElementById('postsContainer');
    const postForm = document.getElementById('postForm');
    const identitySelect = document.getElementById('identitySelect');
    const postTitle = document.getElementById('postTitle');
    const postContent = document.getElementById('postContent');
    const postImages = document.getElementById('postImages');
    const postVideo = document.getElementById('postVideo');
    const publishBtn = document.getElementById('publishBtn');
    const sortBtns = document.querySelectorAll('.sort-bar button');
    const charCount = document.getElementById('charCount');
    const logoutBtn = document.getElementById('logoutBtn');
    const userDisplay = document.getElementById('userDisplay');
    const imageModal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const closeModal = document.getElementById('closeModal');

    let currentUser = null;
    let currentSort = 'latest';

    function setStatus(msg, type = 'info') {
        statusArea.textContent = msg;
        statusArea.className = 'status-box';
        if (type === 'error') statusArea.classList.add('error');
        else if (type === 'success') statusArea.classList.add('success');
        console.log(`[STATUS] ${msg}`);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    function formatTime(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // ===== 登录检查 =====
    async function checkAuth() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error) throw error;
            if (user) {
                currentUser = user;
                const { data: profile } = await supabase.from('profiles').select('username').eq('id', user.id).single();
                userDisplay.textContent = profile?.username || user.email?.split('@')[0] || '用户';
                logoutBtn.style.display = 'inline';
                return true;
            } else {
                userDisplay.textContent = '未登录';
                logoutBtn.style.display = 'none';
                return false;
            }
        } catch (err) {
            setStatus(`登录检查失败: ${err.message}`, 'error');
            return false;
        }
    }

    // ===== 加载身份 =====
    async function loadIdentities() {
        if (!currentUser) return [];
        try {
            const { data, error } = await supabase
                .from('identities')
                .select('*')
                .eq('user_id', currentUser.id);
            if (error) throw error;
            return data || [];
        } catch (err) {
            setStatus(`加载身份失败: ${err.message}`, 'error');
            return [];
        }
    }

    // ===== 加载帖子（简化版，不联表） =====
    async function loadPosts() {
        setStatus('正在加载帖子...', 'info');
        postsContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> 加载中...</div>';
        try {
            const order = currentSort === 'latest' ? 'created_at' : 'likes_count';
            // 先查 posts 表本身
            const { data: postsData, error: postsError } = await supabase
                .from('posts')
                .select('*')
                .order(order, { ascending: false });
            if (postsError) throw postsError;

            if (!postsData || postsData.length === 0) {
                setStatus('暂无动态', 'info');
                postsContainer.innerHTML = `<div class="empty-state"><i class="fas fa-comment" style="font-size:3rem;color:#ddd;"></i><p style="margin-top:10px;">还没有动态</p></div>`;
                return;
            }

            // 单独查询 identities 获取显示名称（避免联表卡住）
            const identityIds = postsData.map(p => p.identity_id).filter(Boolean);
            let identityMap = {};
            if (identityIds.length > 0) {
                const { data: idData, error: idError } = await supabase
                    .from('identities')
                    .select('id, display_name, avatar_url')
                    .in('id', identityIds);
                if (!idError && idData) {
                    identityMap = idData.reduce((acc, row) => { acc[row.id] = row; return acc; }, {});
                }
            }

            // 查询点赞状态
            let likedMap = {};
            if (currentUser) {
                const postIds = postsData.map(p => p.id);
                const { data: likes, error: likeErr } = await supabase
                    .from('post_likes')
                    .select('post_id')
                    .eq('user_id', currentUser.id)
                    .in('post_id', postIds);
                if (!likeErr && likes) {
                    likedMap = likes.reduce((acc, l) => { acc[l.post_id] = true; return acc; }, {});
                }
            }

            const posts = postsData.map(p => {
                const identity = identityMap[p.identity_id] || { display_name: '未知', avatar_url: null };
                return { ...p, identities: identity, userLiked: likedMap[p.id] || false };
            });

            renderPosts(posts);
            setStatus(`✅ 加载成功，共 ${posts.length} 条`, 'success');
        } catch (err) {
            setStatus(`加载失败: ${err.message}`, 'error');
            postsContainer.innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-circle"></i> 
                    <strong>加载失败</strong><br>
                    ${err.message}<br>
                    <button onclick="loadPosts()" style="margin-top:10px;padding:6px 16px;background:#FF3E4D;color:white;border:none;border-radius:30px;cursor:pointer;">重试</button>
                </div>
            `;
        }
    }

    // ===== 渲染帖子 =====
    function renderPosts(posts) {
        let html = '';
        posts.forEach(post => {
            const identity = post.identities || { display_name: '未知', avatar_url: null };
            const avatarLetter = identity.display_name.charAt(0).toUpperCase();
            const hasLiked = post.userLiked || false;
            const images = post.images ? post.images.split(',').filter(Boolean) : [];
            const videoUrl = post.video_url;

            html += `
                <div class="post-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-avatar">${avatarLetter}</div>
                        <div>
                            <div class="post-identity">${escapeHtml(identity.display_name)} <small>${formatTime(post.created_at)}</small></div>
                        </div>
                    </div>
                    ${post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : ''}
                    <div class="post-content">${escapeHtml(post.content)}</div>
                    ${images.length ? `<div class="post-images">${images.map(img => `<img src="${escapeHtml(img)}" loading="lazy" onclick="openModal('${escapeHtml(img)}')">`).join('')}</div>` : ''}
                    ${videoUrl ? `<div style="margin:10px 0;"><video controls src="${escapeHtml(videoUrl)}" style="width:100%;border-radius:12px;"></video></div>` : ''}
                    <div class="post-actions">
                        <button class="like-btn ${hasLiked ? 'liked' : ''}" data-post-id="${post.id}">
                            <i class="fas fa-heart"></i> <span class="like-count">${post.likes_count || 0}</span>
                        </button>
                        <button class="comment-toggle" data-post-id="${post.id}">
                            <i class="fas fa-comment"></i> 评论
                        </button>
                        <button class="share-btn" data-post-id="${post.id}">
                            <i class="fas fa-share-alt"></i> 转发
                        </button>
                    </div>
                    <div class="comments-section" data-post-id="${post.id}">
                        <div class="comments-list"></div>
                        <div class="comment-form-input">
                            <input type="text" placeholder="写评论..." class="comment-input">
                            <button class="comment-submit" data-post-id="${post.id}">发表</button>
                        </div>
                    </div>
                </div>
            `;
        });
        postsContainer.innerHTML = html;
        // 绑定事件
        document.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', () => handleLike(btn)));
        document.querySelectorAll('.comment-toggle').forEach(btn => btn.addEventListener('click', () => toggleComments(btn)));
        document.querySelectorAll('.comment-submit').forEach(btn => btn.addEventListener('click', () => submitComment(btn)));
        document.querySelectorAll('.comment-input').forEach(inp => inp.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') inp.parentElement.querySelector('.comment-submit')?.click();
        }));
        document.querySelectorAll('.share-btn').forEach(btn => btn.addEventListener('click', () => sharePost(btn)));
    }

    // ===== 点赞 =====
    async function handleLike(btn) {
        if (!currentUser) { alert('请先登录'); return; }
        const postId = parseInt(btn.dataset.postId);
        const isLiked = btn.classList.contains('liked');
        const countSpan = btn.querySelector('.like-count');
        let count = parseInt(countSpan.textContent) || 0;
        try {
            if (isLiked) {
                await supabase.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
                btn.classList.remove('liked');
                countSpan.textContent = count - 1;
            } else {
                await supabase.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
                btn.classList.add('liked');
                countSpan.textContent = count + 1;
            }
        } catch (err) { alert('操作失败: ' + err.message); }
    }

    // ===== 评论 =====
    async function toggleComments(btn) {
        const postId = btn.dataset.postId;
        const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
        if (section.classList.contains('open')) { section.classList.remove('open'); return; }
        section.classList.add('open');
        const list = section.querySelector('.comments-list');
        list.innerHTML = '<div class="loading" style="padding:10px;"><i class="fas fa-spinner"></i></div>';
        try {
            const { data, error } = await supabase
                .from('post_comments')
                .select('*, profiles(username)')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });
            if (error) throw error;
            if (!data.length) {
                list.innerHTML = '<div style="color:#999;padding:8px 0;">暂无评论</div>';
            } else {
                list.innerHTML = data.map(c => `
                    <div class="comment-item">
                        <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                        <div>
                            <span class="c-content">${escapeHtml(c.content)}</span>
                            <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                        </div>
                    </div>
                `).join('');
            }
        } catch (err) { list.innerHTML = '<div style="color:#999;">加载失败</div>'; }
    }

    async function submitComment(btn) {
        if (!currentUser) { alert('请先登录'); return; }
        const postId = parseInt(btn.dataset.postId);
        const input = btn.parentElement.querySelector('.comment-input');
        const content = input.value.trim();
        if (!content) return;
        try {
            await supabase.from('post_comments').insert({ post_id: postId, user_id: currentUser.id, content });
            input.value = '';
            // 刷新评论列表
            const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
            const list = section.querySelector('.comments-list');
            const { data } = await supabase
                .from('post_comments')
                .select('*, profiles(username)')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });
            if (data) {
                list.innerHTML = data.map(c => `
                    <div class="comment-item">
                        <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                        <div>
                            <span class="c-content">${escapeHtml(c.content)}</span>
                            <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                        </div>
                    </div>
                `).join('');
            }
        } catch (err) { alert('评论失败: ' + err.message); }
    }

    function sharePost(btn) {
        const postId = btn.dataset.postId;
        const url = window.location.href + '?post=' + postId;
        if (navigator.share) navigator.share({ title: '分享动态', url });
        else navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
    }

    // ===== 图片查看 =====
    function openModal(src) {
        modalImg.src = src;
        imageModal.classList.add('active');
    }
    closeModal.addEventListener('click', () => imageModal.classList.remove('active'));
    imageModal.addEventListener('click', (e) => { if (e.target === imageModal) imageModal.classList.remove('active'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') imageModal.classList.remove('active'); });

    // ===== 发布帖子 =====
    async function publishPost() {
        if (!currentUser) { alert('请先登录'); return; }
        const identityId = identitySelect.value;
        if (!identityId) { alert('请选择发帖身份'); return; }
        const title = postTitle.value.trim();
        const content = postContent.value.trim();
        if (!content) { alert('请输入内容'); return; }
        if (content.length > 300) { alert('内容不能超过300字'); return; }
        const images = postImages.value.trim().split(',').map(s => s.trim()).filter(Boolean);
        const video = postVideo.value.trim();

        try {
            const { error } = await supabase
                .from('posts')
                .insert({
                    user_id: currentUser.id,
                    identity_id: parseInt(identityId),
                    title: title,
                    content: content,
                    images: images.length ? images.join(',') : null,
                    video_url: video || null,
                });
            if (error) throw error;
            postTitle.value = '';
            postContent.value = '';
            postImages.value = '';
            postVideo.value = '';
            charCount.textContent = '0';
            loadPosts();
        } catch (err) {
            alert('发布失败: ' + err.message);
        }
    }

    // ===== 初始化 =====
    (async function init() {
        setStatus('正在初始化...', 'info');

        const loggedIn = await checkAuth();
        if (loggedIn) {
            const identities = await loadIdentities();
            if (identities.length === 0) {
                identitySelect.innerHTML = `<option value="">⚠️ 无身份，请插入身份数据</option>`;
                setStatus('⚠️ 身份表为空，请先插入身份数据', 'error');
            } else {
                identitySelect.innerHTML = identities.map(id => `<option value="${id.id}">${id.display_name}</option>`).join('');
                postForm.style.display = 'block';
                setStatus('✅ 已登录，可以发帖', 'success');
            }
        } else {
            postForm.style.display = 'none';
            setStatus('💡 未登录，仅可浏览', 'info');
        }

        await loadPosts();
    })();

    // ===== 事件绑定 =====
    publishBtn.addEventListener('click', publishPost);
    logoutBtn.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });

    postContent.addEventListener('input', () => {
        charCount.textContent = postContent.value.length;
    });

    sortBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            sortBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSort = btn.dataset.sort;
            loadPosts();
        });
    });
</script>
</body>
</html>
