<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渊华德这一刻 | 诊断版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 720px; margin: 0 auto; }
        .diagnostic {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid #4A90E2;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        .diagnostic.error { border-left-color: #FF3E4D; background: #fff5f5; }
        .diagnostic.success { border-left-color: #06D6A0; }
        .step { padding: 4px 0; }
        .step .time { color: #888; font-size: 0.75rem; margin-right: 8px; }
        .step .msg { color: #333; }
        .step.error .msg { color: #b91c1c; font-weight: 600; }
        .step.success .msg { color: #0a7a3a; }
        .loading { text-align: center; padding: 30px; color: #999; }
        .loading i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 44px; height: 44px; border-radius: 50%; background: #4A90E2; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .post-identity { font-weight: 600; }
        .post-identity small { font-weight: 400; color: #888; font-size: 0.8rem; margin-left: 8px; }
        .post-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
        .post-content { font-size: 0.95rem; line-height: 1.6; margin-bottom: 12px; }
        .post-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
        .post-images img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; cursor: pointer; }
        .post-actions { display: flex; gap: 20px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
        .post-actions button { background: none; border: none; display: flex; align-items: center; gap: 6px; color: #666; cursor: pointer; }
        .post-actions .liked { color: #FF3E4D; }
        .comments-section { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: none; }
        .comments-section.open { display: block; }
        .comment-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .comment-item .c-avatar { width: 28px; height: 28px; border-radius: 50%; background: #4A90E2; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; }
        .comment-form-input { display: flex; gap: 10px; margin-top: 10px; }
        .comment-form-input input { flex: 1; padding: 8px 14px; border: 1px solid #ddd; border-radius: 30px; }
        .comment-form-input button { background: #FF3E4D; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .empty { text-align: center; padding: 40px 0; color: #999; }
        .form-box { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .form-box input, .form-box textarea, .form-box select { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 12px; font-family: inherit; margin-bottom: 12px; }
        .form-box button { background: #FF3E4D; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .sort-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .sort-bar button { background: none; border: none; font-weight: 600; color: #888; padding: 6px 14px; cursor: pointer; }
        .sort-bar button.active { color: #FF3E4D; background: rgba(255,62,77,0.08); border-radius: 30px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- 诊断面板 -->
    <div id="diagnostic" class="diagnostic">⏳ 初始化中...</div>

    <!-- 表单 -->
    <div class="form-box" id="formBox" style="display:none;">
        <h3 style="margin-bottom:15px;">📝 发布动态</h3>
        <select id="identitySelect"><option value="">加载身份...</option></select>
        <input type="text" id="postTitle" placeholder="标题（可选）">
        <textarea id="postContent" placeholder="内容（限300字）" rows="3" maxlength="300"></textarea>
        <div style="text-align:right;font-size:0.8rem;color:#999;"><span id="charCount">0</span>/300</div>
        <input type="text" id="postImages" placeholder="图片链接（逗号分隔）">
        <input type="text" id="postVideo" placeholder="视频链接">
        <button id="publishBtn"><i class="fas fa-pen"></i> 发布</button>
    </div>

    <!-- 排序 -->
    <div class="sort-bar">
        <button class="active" data-sort="latest">最新</button>
        <button data-sort="hot">最热</button>
    </div>

    <!-- 帖子列表 -->
    <div id="postsContainer"><div class="loading"><i class="fas fa-spinner"></i> 加载中...</div></div>
</div>

<script>
    (function() {
        // ===== 配置 =====
        const SUPABASE_URL = 'https://uslzixbrazwuvrjhdgxy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzbHppeGJyYXp3dXZyamhkZ3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODExMDUsImV4cCI6MjA5Mjk1NzEwNX0.xiCB3qA3cciJRutHrv4DRi-hBvAQOiJRXhEmQA7TlmA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM 引用
        const diag = document.getElementById('diagnostic');
        const postsContainer = document.getElementById('postsContainer');
        const formBox = document.getElementById('formBox');
        const identitySelect = document.getElementById('identitySelect');
        const postTitle = document.getElementById('postTitle');
        const postContent = document.getElementById('postContent');
        const postImages = document.getElementById('postImages');
        const postVideo = document.getElementById('postVideo');
        const publishBtn = document.getElementById('publishBtn');
        const charCount = document.getElementById('charCount');
        const sortBtns = document.querySelectorAll('.sort-bar button');

        let currentUser = null;
        let currentSort = 'latest';
        let timeoutId = null;

        // ===== 诊断日志 =====
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `step ${type}`;
            entry.innerHTML = `<span class="time">[${time}]</span><span class="msg">${msg}</span>`;
            diag.appendChild(entry);
            diag.scrollTop = diag.scrollHeight;
            // 更新头部状态
            if (type === 'error') diag.className = 'diagnostic error';
            else if (type === 'success') diag.className = 'diagnostic success';
            else diag.className = 'diagnostic';
        }

        function setStatus(msg, type = 'info') {
            log(msg, type);
        }

        // ===== 超时保护 =====
        function startTimeout(seconds = 10) {
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                log(`⏰ 操作超时（${seconds}秒），可能表不存在或网络问题`, 'error');
                postsContainer.innerHTML = `
                    <div style="background:#fff0f0;border-left:4px solid #FF3E4D;padding:20px;border-radius:12px;color:#b91c1c;">
                        <strong>超时错误</strong><br>
                        请检查：<br>
                        1. 是否已执行建表 SQL？<br>
                        2. 网络是否正常？<br>
                        3. Supabase 项目是否可用？<br>
                        <button onclick="location.reload()" style="margin-top:10px;padding:6px 16px;background:#FF3E4D;color:white;border:none;border-radius:30px;cursor:pointer;">重试</button>
                    </div>
                `;
            }, seconds * 1000);
        }

        function clearTimeout() {
            if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
        }

        // ===== 检查登录 =====
        async function checkAuth() {
            log('🔍 检查登录状态...');
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (error) throw error;
                if (user) {
                    currentUser = user;
                    log(`✅ 已登录: ${user.email}`, 'success');
                    // 获取用户名
                    const { data: profile } = await supabase.from('profiles').select('username').eq('id', user.id).single();
                    if (profile?.username) log(`👤 用户名: ${profile.username}`);
                    return true;
                } else {
                    log('ℹ️ 未登录', 'info');
                    return false;
                }
            } catch (err) {
                log(`❌ 登录检查失败: ${err.message}`, 'error');
                return false;
            }
        }

        // ===== 加载身份 =====
        async function loadIdentities() {
            if (!currentUser) return [];
            log('🔍 加载身份...');
            try {
                const { data, error } = await supabase
                    .from('identities')
                    .select('*')
                    .eq('user_id', currentUser.id);
                if (error) throw error;
                log(`✅ 找到 ${data?.length || 0} 个身份`, data?.length ? 'success' : 'info');
                return data || [];
            } catch (err) {
                log(`❌ 加载身份失败: ${err.message}`, 'error');
                return [];
            }
        }

        // ===== 加载帖子 =====
        async function loadPosts() {
            log('🔍 加载帖子列表...');
            postsContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> 加载中...</div>';
            startTimeout(8);
            try {
                const order = currentSort === 'latest' ? 'created_at' : 'likes_count';
                // 先简单查询验证表是否存在
                const { error: tableCheck } = await supabase.from('posts').select('id').limit(1);
                if (tableCheck && tableCheck.code === '42P01') {
                    clearTimeout();
                    log('❌ 表 "posts" 不存在，请执行建表 SQL', 'error');
                    postsContainer.innerHTML = `
                        <div style="background:#fff0f0;border-left:4px solid #FF3E4D;padding:20px;border-radius:12px;color:#b91c1c;">
                            <strong>表不存在</strong><br>
                            请先在 Supabase SQL Editor 中执行建表 SQL（包括 posts, identities, post_likes, post_comments）。<br>
                            <button onclick="location.reload()" style="margin-top:10px;padding:6px 16px;background:#FF3E4D;color:white;border:none;border-radius:30px;cursor:pointer;">重试</button>
                        </div>
                    `;
                    return;
                }

                const { data, error } = await supabase
                    .from('posts')
                    .select(`
                        *,
                        identities (display_name, avatar_url)
                    `)
                    .order(order, { ascending: false });
                clearTimeout();
                if (error) throw error;

                if (!data || data.length === 0) {
                    log('📭 暂无帖子', 'info');
                    postsContainer.innerHTML = `<div class="empty">暂无动态，快来发布第一条吧！</div>`;
                    return;
                }

                // 查询点赞状态
                let likedMap = {};
                if (currentUser) {
                    const postIds = data.map(p => p.id);
                    const { data: likes, error: likeErr } = await supabase
                        .from('post_likes')
                        .select('post_id')
                        .eq('user_id', currentUser.id)
                        .in('post_id', postIds);
                    if (!likeErr && likes) {
                        likedMap = likes.reduce((acc, l) => { acc[l.post_id] = true; return acc; }, {});
                    }
                }

                const posts = data.map(p => ({ ...p, userLiked: likedMap[p.id] || false }));
                renderPosts(posts);
                log(`✅ 加载成功，共 ${posts.length} 条`, 'success');
            } catch (err) {
                clearTimeout();
                log(`❌ 加载失败: ${err.message}`, 'error');
                postsContainer.innerHTML = `
                    <div style="background:#fff0f0;border-left:4px solid #FF3E4D;padding:20px;border-radius:12px;color:#b91c1c;">
                        <strong>加载失败</strong><br>
                        ${err.message}
                        <button onclick="loadPosts()" style="margin-top:10px;padding:6px 16px;background:#FF3E4D;color:white;border:none;border-radius:30px;cursor:pointer;">重试</button>
                    </div>
                `;
            }
        }

        // ===== 渲染帖子 =====
        function renderPosts(posts) {
            let html = '';
            posts.forEach(post => {
                const identity = post.identities || { display_name: '未知', avatar_url: null };
                const avatarLetter = identity.display_name.charAt(0).toUpperCase();
                const hasLiked = post.userLiked || false;
                const images = post.images ? post.images.split(',').filter(Boolean) : [];
                const videoUrl = post.video_url;

                html += `
                    <div class="post-card" data-post-id="${post.id}">
                        <div class="post-header">
                            <div class="post-avatar">${avatarLetter}</div>
                            <div>
                                <div class="post-identity">${escapeHtml(identity.display_name)} <small>${formatTime(post.created_at)}</small></div>
                            </div>
                        </div>
                        ${post.title ? `<div class="post-title">${escapeHtml(post.title)}</div>` : ''}
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        ${images.length ? `<div class="post-images">${images.map(img => `<img src="${escapeHtml(img)}" loading="lazy" onclick="openModal('${escapeHtml(img)}')">`).join('')}</div>` : ''}
                        ${videoUrl ? `<div style="margin:10px 0;"><video controls src="${escapeHtml(videoUrl)}" style="width:100%;border-radius:12px;"></video></div>` : ''}
                        <div class="post-actions">
                            <button class="like-btn ${hasLiked ? 'liked' : ''}" data-post-id="${post.id}">
                                ❤️ <span class="like-count">${post.likes_count || 0}</span>
                            </button>
                            <button class="comment-toggle" data-post-id="${post.id}">
                                💬 评论
                            </button>
                            <button class="share-btn" data-post-id="${post.id}">
                                🔗 转发
                            </button>
                        </div>
                        <div class="comments-section" data-post-id="${post.id}">
                            <div class="comments-list"></div>
                            <div class="comment-form-input">
                                <input type="text" placeholder="写评论..." class="comment-input">
                                <button class="comment-submit" data-post-id="${post.id}">发表</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            postsContainer.innerHTML = html;
            // 绑定事件
            document.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', () => handleLike(btn)));
            document.querySelectorAll('.comment-toggle').forEach(btn => btn.addEventListener('click', () => toggleComments(btn)));
            document.querySelectorAll('.comment-submit').forEach(btn => btn.addEventListener('click', () => submitComment(btn)));
            document.querySelectorAll('.comment-input').forEach(inp => inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') inp.parentElement.querySelector('.comment-submit')?.click();
            }));
            document.querySelectorAll('.share-btn').forEach(btn => btn.addEventListener('click', () => sharePost(btn)));
        }

        // ===== 辅助函数 =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }
        function formatTime(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // ===== 点赞 =====
        async function handleLike(btn) {
            if (!currentUser) { alert('请先登录'); return; }
            const postId = parseInt(btn.dataset.postId);
            const isLiked = btn.classList.contains('liked');
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.textContent) || 0;
            try {
                if (isLiked) {
                    await supabase.from('post_likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
                    btn.classList.remove('liked');
                    countSpan.textContent = count - 1;
                } else {
                    await supabase.from('post_likes').insert({ post_id: postId, user_id: currentUser.id });
                    btn.classList.add('liked');
                    countSpan.textContent = count + 1;
                }
            } catch (err) { alert('操作失败: ' + err.message); }
        }

        // ===== 评论 =====
        async function toggleComments(btn) {
            const postId = btn.dataset.postId;
            const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
            if (section.classList.contains('open')) { section.classList.remove('open'); return; }
            section.classList.add('open');
            const list = section.querySelector('.comments-list');
            list.innerHTML = '<div class="loading" style="padding:10px;"><i class="fas fa-spinner"></i></div>';
            try {
                const { data, error } = await supabase
                    .from('post_comments')
                    .select('*, profiles(username)')
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true });
                if (error) throw error;
                if (!data.length) {
                    list.innerHTML = '<div style="color:#999;padding:8px 0;">暂无评论</div>';
                } else {
                    list.innerHTML = data.map(c => `
                        <div class="comment-item">
                            <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                            <div>
                                <span class="c-content">${escapeHtml(c.content)}</span>
                                <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { list.innerHTML = '<div style="color:#999;">加载失败</div>'; }
        }

        async function submitComment(btn) {
            if (!currentUser) { alert('请先登录'); return; }
            const postId = parseInt(btn.dataset.postId);
            const input = btn.parentElement.querySelector('.comment-input');
            const content = input.value.trim();
            if (!content) return;
            try {
                await supabase.from('post_comments').insert({ post_id: postId, user_id: currentUser.id, content });
                input.value = '';
                // 刷新评论列表
                const section = document.querySelector(`.comments-section[data-post-id="${postId}"]`);
                const list = section.querySelector('.comments-list');
                const { data } = await supabase
                    .from('post_comments')
                    .select('*, profiles(username)')
                    .eq('post_id', postId)
                    .order('created_at', { ascending: true });
                if (data) {
                    list.innerHTML = data.map(c => `
                        <div class="comment-item">
                            <div class="c-avatar">${c.profiles?.username ? c.profiles.username.charAt(0).toUpperCase() : '?'}</div>
                            <div>
                                <span class="c-content">${escapeHtml(c.content)}</span>
                                <span class="c-meta">— ${c.profiles?.username || '匿名'}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) { alert('评论失败: ' + err.message); }
        }

        function sharePost(btn) {
            const postId = btn.dataset.postId;
            const url = window.location.href + '?post=' + postId;
            if (navigator.share) navigator.share({ title: '分享动态', url });
            else navigator.clipboard.writeText(url).then(() => alert('链接已复制'));
        }

        // ===== 发布 =====
        async function publishPost() {
            if (!currentUser) { alert('请先登录'); return; }
            const identityId = identitySelect.value;
            if (!identityId) { alert('请选择发帖身份'); return; }
            const title = postTitle.value.trim();
            const content = postContent.value.trim();
            if (!content) { alert('请输入内容'); return; }
            if (content.length > 300) { alert('内容不能超过300字'); return; }
            const images = postImages.value.trim().split(',').map(s => s.trim()).filter(Boolean);
            const video = postVideo.value.trim();

            try {
                const { error } = await supabase
                    .from('posts')
                    .insert({
                        user_id: currentUser.id,
                        identity_id: parseInt(identityId),
                        title: title,
                        content: content,
                        images: images.length ? images.join(',') : null,
                        video_url: video || null,
                    });
                if (error) throw error;
                postTitle.value = '';
                postContent.value = '';
                postImages.value = '';
                postVideo.value = '';
                charCount.textContent = '0';
                loadPosts();
            } catch (err) {
                alert('发布失败: ' + err.message);
            }
        }

        // ===== 图片查看 =====
        function openModal(src) {
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:10000;cursor:pointer;';
            modal.innerHTML = `<img src="${src}" style="max-width:90%;max-height:90vh;object-fit:contain;border-radius:8px;">`;
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        // ===== 字符计数 =====
        postContent.addEventListener('input', () => {
            charCount.textContent = postContent.value.length;
        });

        // ===== 排序切换 =====
        sortBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sortBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                loadPosts();
            });
        });

        // ===== 初始化 =====
        (async function init() {
            log('🚀 应用启动', 'info');

            // 检查登录
            const loggedIn = await checkAuth();
            if (loggedIn) {
                const identities = await loadIdentities();
                if (identities.length === 0) {
                    log('⚠️ 身份表为空，请先插入身份数据（INSERT INTO identities ...）', 'error');
                    identitySelect.innerHTML = `<option value="">无身份，请插入</option>`;
                } else {
                    identitySelect.innerHTML = identities.map(id => `<option value="${id.id}">${id.display_name}</option>`).join('');
                    formBox.style.display = 'block';
                    log('✅ 表单已启用', 'success');
                }
            } else {
                formBox.style.display = 'none';
                log('ℹ️ 未登录，仅可浏览', 'info');
            }

            // 加载帖子
            await loadPosts();

            // 发布按钮
            publishBtn.addEventListener('click', publishPost);
        })();

        // 暴露 openModal 到全局
        window.openModal = openModal;
    })();
</script>
</body>
</html>
