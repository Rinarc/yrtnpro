<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>成绩查询 · 渊华德招考网</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: #e8ecf1;
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 水印背景 ===== */
        #watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><text x="50%" y="50%" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="%23000" transform="rotate(-25, 100, 100)" text-anchor="middle" dominant-baseline="central">渊华德教育考试院</text></svg>');
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            box-shadow: 0 16px 48px rgba(10, 30, 61, 0.20);
            padding: 32px 36px 28px;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ===== 登录表单 ===== */
        #loginArea .header-title {
            text-align: center;
            margin-bottom: 6px;
        }
        #loginArea .header-title .exam-badge {
            display: inline-block;
            background: #0a1e3d;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 18px;
            border-radius: 20px;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        #loginArea .header-title h2 {
            font-size: 26px;
            color: #0a1e3d;
            letter-spacing: 2px;
            font-weight: 700;
        }
        #loginArea .header-title .sub {
            color: #6f7f8f;
            font-size: 14px;
            margin-top: 2px;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 16px;
        }

        .login-form .form-group {
            margin-bottom: 18px;
        }
        .login-form label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #0a1e3d;
            margin-bottom: 4px;
        }
        .login-form input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d0d8e0;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.2s;
            background: #fff;
        }
        .login-form input:focus {
            border-color: #c9a84c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
        }

        .slider-container {
            margin: 16px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container label {
            font-size: 14px;
            color: #556677;
            white-space: nowrap;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #d0d8e0;
            border-radius: 4px;
            outline: none;
            transition: background 0.3s;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0a1e3d;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0a1e3d;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .slider-container .slider-value {
            font-size: 14px;
            color: #0a1e3d;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }
        .btn {
            padding: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .btn-primary {
            background: #0a1e3d;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1a3a6a;
        }
        .btn-secondary {
            background: #eef2f6;
            color: #0a1e3d;
        }
        .btn-secondary:hover {
            background: #dce1e8;
        }

        .login-form .error-msg {
            color: #c0392b;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }
        .login-form .hint {
            font-size: 13px;
            color: #99aabb;
            margin-top: 16px;
            text-align: center;
        }

        /* ===== 成绩展示区（横向布局） ===== */
        .result-area {
            display: none;
        }
        .result-area.active {
            display: block;
        }

        /* 顶部机构名称 */
        .result-header-top {
            text-align: center;
            border-bottom: 2px solid #0a1e3d;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .result-header-top .org-name {
            font-size: 22px;
            font-weight: 700;
            color: #0a1e3d;
            letter-spacing: 4px;
        }
        .result-header-top .org-name-en {
            font-size: 11px;
            color: #6f7f8f;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .result-header-top .title-main {
            font-size: 20px;
            font-weight: 700;
            color: #0a1e3d;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* 个人信息行 */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px;
            border-bottom: 1px solid #eef2f6;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px 20px;
        }
        .info-row .info-item {
            font-size: 15px;
        }
        .info-row .info-item strong {
            color: #0a1e3d;
        }
        .info-row .city-badge {
            display: inline-block;
            background: #0a1e3d;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        /* 成绩横向表格 */
        .score-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: #eef2f6;
            border: 1px solid #d0d8e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .score-grid .score-item {
            flex: 1 1 0;
            min-width: 70px;
            background: #fff;
            padding: 8px 4px;
            text-align: center;
            border-right: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }
        .score-grid .score-item:last-child {
            border-right: none;
        }
        .score-grid .score-item .label {
            font-size: 12px;
            color: #6f7f8f;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .score-grid .score-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #0a1e3d;
            margin-top: 2px;
            line-height: 1.2;
        }
        .score-grid .score-item .value .sub-score {
            font-size: 13px;
            font-weight: 400;
            color: #6f7f8f;
            display: inline-block;
            margin-left: 4px;
        }
        .score-grid .score-item .value .sub-score-list {
            font-size: 11px;
            font-weight: 400;
            color: #6f7f8f;
            display: block;
            margin-top: 1px;
            letter-spacing: 0.3px;
        }
        /* 总分特殊样式 */
        .score-grid .score-item.total {
            background: #f8faff;
            border-left: 2px solid #0a1e3d;
            flex: 1.2 1 0;
        }
        .score-grid .score-item.total .value {
            font-size: 24px;
            color: #c0392b;
        }
        .score-grid .score-item.total .label {
            font-weight: 700;
            color: #0a1e3d;
        }

        /* 附加分行 */
        .extra-row {
            display: flex;
            justify-content: flex-end;
            padding: 6px 16px 10px;
            border-bottom: 1px solid #eef2f6;
            margin-bottom: 12px;
        }
        .extra-row .extra-item {
            font-size: 15px;
            font-weight: 500;
            color: #0a1e3d;
        }
        .extra-row .extra-item span {
            font-weight: 700;
            color: #c0392b;
            margin-left: 6px;
        }

        /* 注意事项 */
        .notes {
            font-size: 12px;
            color: #6f7f8f;
            line-height: 1.8;
            padding: 8px 4px 0;
            border-top: 1px solid #eef2f6;
            margin-top: 4px;
        }
        .notes li {
            list-style: none;
            padding: 2px 0;
        }
        .notes li::before {
            content: "• ";
            color: #0a1e3d;
        }

        /* 底部章 & 操作按钮 */
        .result-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        .result-footer .stamp {
            font-size: 13px;
            color: #0a1e3d;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-footer .stamp i {
            font-size: 20px;
            opacity: 0.5;
        }
        .result-footer .actions {
            display: flex;
            gap: 12px;
        }
        .result-footer .actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-gold {
            background: #c9a84c;
            color: #0a1e3d;
        }
        .btn-gold:hover {
            background: #b8973a;
        }
        .btn-outline {
            background: transparent;
            color: #0a1e3d;
            border: 1px solid #d0d8e0;
        }
        .btn-outline:hover {
            background: #eef2f6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .card {
                padding: 20px 16px;
            }
            .score-grid .score-item {
                min-width: 56px;
                min-height: 60px;
                padding: 6px 2px;
            }
            .score-grid .score-item .value {
                font-size: 17px;
            }
            .score-grid .score-item .label {
                font-size: 11px;
            }
            .score-grid .score-item.total .value {
                font-size: 20px;
            }
            .result-header-top .org-name {
                font-size: 18px;
            }
            .result-header-top .title-main {
                font-size: 17px;
            }
            .info-row {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .info-row .info-item {
                font-size: 14px;
            }
            .btn-row {
                flex-direction: column;
            }
            .result-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .result-footer .actions {
                justify-content: center;
            }
            .slider-container {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .score-grid {
                gap: 1px;
            }
            .score-grid .score-item {
                min-width: 44px;
                min-height: 50px;
                padding: 4px 2px;
            }
            .score-grid .score-item .value {
                font-size: 15px;
            }
            .score-grid .score-item .label {
                font-size: 10px;
            }
            .score-grid .score-item.total .value {
                font-size: 17px;
            }
            .card {
                padding: 14px 10px;
            }
            #loginArea .header-title h2 {
                font-size: 20px;
            }
            .result-header-top .org-name {
                font-size: 16px;
            }
            .result-header-top .title-main {
                font-size: 15px;
            }
        }

        /* 打印优化 */
        @media print {
            #watermark {
                opacity: 0.03;
            }
            .no-print {
                display: none !important;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .score-grid .score-item.total {
                background: #f5f5f5;
            }
            .result-footer .stamp {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- 水印背景 -->
    <div id="watermark"></div>

    <div class="container">
        <div class="card">
            <!-- ===== 登录区域 ===== -->
            <div id="loginArea">
                <div class="header-title">
                    <div class="exam-badge">渊华德教育考试院</div>
                    <h2>2026年渊华德教育考试院初中学业水平考试</h2>
                    <div class="sub">成绩查询</div>
                </div>
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> 考生报名号</label>
                        <input type="text" id="username" placeholder="请输入报名号" required />
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> 密码</label>
                        <input type="password" id="password" placeholder="请输入密码" required />
                    </div>

                    <div class="slider-container">
                        <label><i class="fas fa-arrows-alt-h"></i> 请按住滑块</label>
                        <input type="range" id="slider" min="0" max="100" value="0" />
                        <span class="slider-value" id="sliderValue">0%</span>
                    </div>
                    <div style="text-align:right; font-size:13px; color:#99aabb; margin-top:-8px; margin-bottom:12px;">
                        *请按住滑块，划到最右边
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 查询</button>
                        <button type="reset" class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                    <div id="loginError" class="error-msg"></div>
                    <div class="hint">报名号前两位：12-渊迂市 · 13-华兴市 · 14-德水市</div>
                </form>
            </div>

            <!-- ===== 成绩展示区域 ===== -->
            <div id="resultArea" class="result-area">
                <!-- 头部 -->
                <div class="result-header-top">
                    <div class="org-name">渊华德教育考试院</div>
                    <div class="org-name-en">YUANHUADE EDUCATIONAL EXAMINATION AUTHORITY</div>
                    <div class="title-main" id="cityTitle">2026年渊迂市初中学业水平考试成绩查询</div>
                </div>

                <!-- 个人信息 -->
                <div class="info-row">
                    <div class="info-item"><strong>姓名：</strong><span id="displayName">--</span></div>
                    <div class="info-item"><strong>报名号：</strong><span id="displayId">--</span></div>
                    <span class="city-badge" id="cityBadge">渊迂市</span>
                </div>

                <!-- 成绩横向网格 -->
                <div id="scoreGridContainer">
                    <!-- 由 JS 动态生成 -->
                </div>

                <!-- 附加分 -->
                <div class="extra-row" id="extraRow">
                    <div class="extra-item">附加分：<span id="extraScore">0</span></div>
                </div>

                <!-- 注意事项 -->
                <ul class="notes" id="notesArea">
                    <li>“/”表示该科目无成绩，“Q”表示该科目考试缺考</li>
                    <li>外语科目含笔试和听说测试成绩</li>
                    <li>道德与法治科目含统一考试和日常考核成绩</li>
                    <li>历史科目含统一考试和日常考核成绩</li>
                </ul>

                <!-- 底部 -->
                <div class="result-footer">
                    <div class="stamp">
                        <i class="fas fa-stamp"></i> 成绩专用章 · 渊华德教育考试院
                    </div>
                    <div class="actions no-print">
                        <button class="btn-sm btn-outline" id="backBtn"><i class="fas fa-arrow-left"></i> 返回查询</button>
                        <button class="btn-sm btn-gold" id="printBtn"><i class="fas fa-print"></i> 打印</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const loginArea = document.getElementById('loginArea');
            const resultArea = document.getElementById('resultArea');
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginError = document.getElementById('loginError');
            const slider = document.getElementById('slider');
            const sliderValue = document.getElementById('sliderValue');
            const resetBtn = document.getElementById('resetBtn');
            const backBtn = document.getElementById('backBtn');
            const printBtn = document.getElementById('printBtn');

            const displayName = document.getElementById('displayName');
            const displayId = document.getElementById('displayId');
            const cityBadge = document.getElementById('cityBadge');
            const cityTitle = document.getElementById('cityTitle');
            const scoreGridContainer = document.getElementById('scoreGridContainer');
            const extraScoreSpan = document.getElementById('extraScore');

            // ===== 滑块交互 =====
            slider.addEventListener('input', function() {
                sliderValue.textContent = this.value + '%';
                if (this.value == 100) {
                    this.style.background = '#27ae60';
                } else {
                    this.style.background = '#d0d8e0';
                }
            });

            resetBtn.addEventListener('click', function() {
                loginError.textContent = '';
                slider.value = 0;
                sliderValue.textContent = '0%';
                slider.style.background = '#d0d8e0';
            });

            // ===== 数据存储 =====
            let allUsers = [];
            let allScores = [];

            // ===== 加载 account.json =====
            async function loadAccounts() {
                try {
                    const res = await fetch('account.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allUsers = data.users || [];
                    console.log('✅ 账户数据加载成功');
                } catch (err) {
                    console.warn('⚠️ 加载 account.json 失败，使用模拟数据。', err);
                    allUsers = [
                        { "报名号": "12260101", "密码": "123456", "姓名": "张渊", "城市": "渊迂市" },
                        { "报名号": "13260001", "密码": "123456", "姓名": "李华", "城市": "华兴市" },
                        { "报名号": "14260001", "密码": "123456", "姓名": "王德", "城市": "德水市" }
                    ];
                }
            }

            // ===== 加载 score.json =====
            async function loadScores() {
                try {
                    const res = await fetch('service-yhdmeea-score.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allScores = data.scores || [];
                    console.log('✅ 成绩数据加载成功');
                } catch (err) {
                    console.warn('⚠️ 加载 score.json 失败，使用模拟数据。', err);
                    allScores = [
                        { "报名号": "12260101", "语文": 133, "数学": 126, "外语": 145, "综合测试": 134, "物理": 59,
                            "化学": 45, "跨学科": 15, "物理实验": 10, "化学实验": 5, "道德与法治": 59, "历史": 56,
                            "体育与健康": 30, "附加分": 0 },
                        { "报名号": "13260001", "语文": 120, "数学": 110, "外语": 100, "综合测试": 120, "物理": 38,
                            "化学": 35, "跨学科": 18, "物理实验": 14, "化学实验": 15, "道德与法治": 25, "历史": 27,
                            "体育与健康": 28, "附加分": 0 },
                        { "报名号": "14260001", "语文": 115, "数学": 105, "外语": 95, "综合测试": 110, "物理": 34,
                            "化学": 30, "跨学科": 16, "物理实验": 12, "化学实验": 18, "道德与法治": 22, "历史": 24,
                            "体育与健康": 27, "附加分": 0 }
                    ];
                }
            }

            // ===== 判断城市 =====
            function getCityFromId(报名号) {
                const prefix = 报名号.substring(0, 2);
                if (prefix === '12') return '渊迂市';
                else if (prefix === '13') return '华兴市';
                else if (prefix === '14') return '德水市';
                else return '未知城市';
            }

            // ===== 登录提交 =====
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                loginError.textContent = '';

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (!username || !password) {
                    loginError.textContent = '请输入完整的报名号和密码';
                    return;
                }

                if (parseInt(slider.value, 10) < 100) {
                    loginError.textContent = '请将滑块划到最右边以验证';
                    return;
                }

                const user = allUsers.find(u => u.报名号 === username && u.密码 === password);
                if (!user) {
                    loginError.textContent = '❌ 报名号或密码错误，请重新输入';
                    return;
                }

                const score = allScores.find(s => s.报名号 === username);
                if (!score) {
                    loginError.textContent = '❌ 未找到该考生的成绩数据';
                    return;
                }

                const city = getCityFromId(username);
                displayName.textContent = user.姓名;
                displayId.textContent = username;
                cityBadge.textContent = city;
                cityTitle.textContent = `2026年${city}初中学业水平考试成绩查询`;

                renderScore(score);

                loginArea.style.display = 'none';
                resultArea.classList.add('active');
                loginError.textContent = '';
            });

            // ===== 渲染成绩（横向网格） =====
            function renderScore(score) {
                // 定义科目顺序及显示名称
                const subjects = [
                    { key: '语文', label: '语文' },
                    { key: '数学', label: '数学' },
                    { key: '外语', label: '外语' },
                    { key: '综合测试', label: '综合测试', sub: ['物理', '化学', '跨学科', '物理实验', '化学实验'] },
                    { key: '道德与法治', label: '道德与法治' },
                    { key: '历史', label: '历史' },
                    { key: '体育与健康', label: '体育与健康' }
                ];

                // 计算总分（所有主科目之和 + 附加分）
                let total = 0;
                subjects.forEach(sub => {
                    const val = score[sub.key];
                    if (val !== undefined && val !== null && val !== 'Q' && val !== '/') {
                        total += Number(val);
                    }
                });
                const extra = score.附加分 || 0;
                total += Number(extra);

                // 构建网格
                let html = `<div class="score-grid">`;

                subjects.forEach(sub => {
                    const val = score[sub.key];
                    let displayVal = (val !== undefined && val !== null) ? val : '/';
                    if (displayVal === 'Q') displayVal = 'Q';

                    // 如果有子科目，显示明细
                    let subHtml = '';
                    if (sub.sub && Array.isArray(sub.sub)) {
                        const details = sub.sub.map(sk => {
                            const v = score[sk];
                            const dv = (v !== undefined && v !== null) ? v : '/';
                            return `${sk} ${dv}`;
                        }).join(' ');
                        subHtml = `<span class="sub-score-list">${details}</span>`;
                    }

                    html += `
                        <div class="score-item">
                            <div class="label">${sub.label}</div>
                            <div class="value">${displayVal} ${subHtml}</div>
                        </div>
                    `;
                });

                // 总分列
                html += `
                    <div class="score-item total">
                        <div class="label">总分</div>
                        <div class="value">${total}</div>
                    </div>
                `;

                html += `</div>`;
                scoreGridContainer.innerHTML = html;

                // 附加分
                extraScoreSpan.textContent = extra;
            }

            // ===== 返回查询 =====
            backBtn.addEventListener('click', function() {
                resultArea.classList.remove('active');
                loginArea.style.display = 'block';
                usernameInput.value = '';
                passwordInput.value = '';
                slider.value = 0;
                sliderValue.textContent = '0%';
                slider.style.background = '#d0d8e0';
                loginError.textContent = '';
            });

            // ===== 打印 =====
            printBtn.addEventListener('click', function() {
                window.print();
            });

            // ===== 初始化 =====
            async function init() {
                await loadAccounts();
                await loadScores();
                console.log('📊 成绩查询页面已加载（横向成绩单样式）');
            }

            init();

        })();
    </script>
</body>
</html>
