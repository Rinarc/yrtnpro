<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>录取查询 · 渊华德招考网</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: #e8ecf1;
            color: #1a2a3a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><text x="50%" y="50%" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="%23000" transform="rotate(-25, 100, 100)" text-anchor="middle" dominant-baseline="central">渊华德教育考试院</text></svg>');
            background-repeat: repeat;
            background-size: 180px 180px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            box-shadow: 0 16px 48px rgba(10, 30, 61, 0.20);
            padding: 32px 36px 28px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ===== 登录 ===== */
        #loginArea .header-title {
            text-align: center;
            margin-bottom: 6px;
        }
        #loginArea .header-title .exam-badge {
            display: inline-block;
            background: #0a1e3d;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 2px 18px;
            border-radius: 20px;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        #loginArea .header-title h2 {
            font-size: 26px;
            color: #0a1e3d;
            letter-spacing: 2px;
            font-weight: 700;
        }
        #loginArea .header-title .sub {
            color: #6f7f8f;
            font-size: 14px;
            margin-top: 2px;
            border-bottom: 1px solid #eef2f6;
            padding-bottom: 16px;
        }

        .login-form .form-group {
            margin-bottom: 18px;
        }
        .login-form label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #0a1e3d;
            margin-bottom: 4px;
        }
        .login-form input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d0d8e0;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.2s;
            background: #fff;
        }
        .login-form input:focus {
            border-color: #c9a84c;
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
        }

        .slider-container {
            margin: 16px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container label {
            font-size: 14px;
            color: #556677;
            white-space: nowrap;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #d0d8e0;
            border-radius: 4px;
            outline: none;
            transition: background 0.3s;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0a1e3d;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .slider-container input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #0a1e3d;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .slider-container .slider-value {
            font-size: 14px;
            color: #0a1e3d;
            font-weight: 600;
            min-width: 40px;
            text-align: center;
        }

        .btn-row {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }
        .btn {
            padding: 10px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }
        .btn-primary {
            background: #0a1e3d;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1a3a6a;
        }
        .btn-secondary {
            background: #eef2f6;
            color: #0a1e3d;
        }
        .btn-secondary:hover {
            background: #dce1e8;
        }

        .login-form .error-msg {
            color: #c0392b;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }
        .login-form .hint {
            font-size: 13px;
            color: #99aabb;
            margin-top: 16px;
            text-align: center;
        }

        /* ===== 录取结果展示 ===== */
        .result-area {
            display: none;
        }
        .result-area.active {
            display: block;
        }

        .result-header-top {
            text-align: center;
            border-bottom: 2px solid #0a1e3d;
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .result-header-top .org-name {
            font-size: 22px;
            font-weight: 700;
            color: #0a1e3d;
            letter-spacing: 4px;
        }
        .result-header-top .org-name-en {
            font-size: 11px;
            color: #6f7f8f;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .result-header-top .title-main {
            font-size: 20px;
            font-weight: 700;
            color: #0a1e3d;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 14px;
            border-bottom: 1px solid #eef2f6;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 8px 20px;
        }
        .info-row .info-item {
            font-size: 15px;
        }
        .info-row .info-item strong {
            color: #0a1e3d;
        }
        .info-row .city-badge {
            display: inline-block;
            background: #0a1e3d;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .result-box {
            background: #f8faff;
            border-radius: 10px;
            padding: 32px 24px;
            text-align: center;
            border: 1px solid #eef2f6;
            margin-bottom: 20px;
        }
        .result-box .label {
            font-size: 14px;
            color: #6f7f8f;
            letter-spacing: 1px;
        }
        .result-box .main-result {
            font-size: 28px;
            font-weight: 700;
            color: #0a1e3d;
            margin-top: 12px;
            line-height: 1.5;
        }
        .result-box .main-result .highlight {
            color: #c0392b;
        }
        .result-box .sub-note {
            margin-top: 16px;
            font-size: 14px;
            color: #6f7f8f;
            border-top: 1px dashed #d0d8e0;
            padding-top: 16px;
        }

        .no-data {
            text-align: center;
            padding: 30px 0;
            color: #99aabb;
            font-size: 16px;
        }

        .result-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef2f6;
        }
        .result-footer .stamp {
            font-size: 13px;
            color: #0a1e3d;
            font-weight: 600;
            letter-spacing: 1px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .result-footer .stamp i {
            font-size: 20px;
            opacity: 0.5;
        }
        .result-footer .actions {
            display: flex;
            gap: 12px;
        }
        .result-footer .actions .btn-sm {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-gold {
            background: #c9a84c;
            color: #0a1e3d;
        }
        .btn-gold:hover {
            background: #b8973a;
        }
        .btn-outline {
            background: transparent;
            color: #0a1e3d;
            border: 1px solid #d0d8e0;
        }
        .btn-outline:hover {
            background: #eef2f6;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }
            .result-header-top .org-name {
                font-size: 18px;
            }
            .result-header-top .title-main {
                font-size: 17px;
            }
            .info-row {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .result-box .main-result {
                font-size: 22px;
            }
            .btn-row {
                flex-direction: column;
            }
            .result-footer {
                flex-direction: column;
                align-items: stretch;
            }
            .result-footer .actions {
                justify-content: center;
            }
            .slider-container {
                flex-wrap: wrap;
            }
        }

        @media print {
            #watermark {
                opacity: 0.02;
            }
            .no-print {
                display: none !important;
            }
            .card {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .result-box {
                background: #f5f5f5;
            }
        }
    </style>
</head>
<body>
    <!-- 水印背景 -->
    <div id="watermark"></div>

    <div class="container">
        <div class="card">
            <!-- 登录区域 -->
            <div id="loginArea">
                <div class="header-title">
                    <div class="exam-badge">渊华德教育考试院</div>
                    <h2>2026年渊华德教育考试院高中阶段学校招生录取查询</h2>
                    <div class="sub">录取结果查询</div>
                </div>
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> 考生报名号</label>
                        <input type="text" id="username" placeholder="请输入报名号" required />
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> 密码</label>
                        <input type="password" id="password" placeholder="请输入密码" required />
                    </div>

                    <div class="slider-container">
                        <label><i class="fas fa-arrows-alt-h"></i> 请按住滑块</label>
                        <input type="range" id="slider" min="0" max="100" value="0" />
                        <span class="slider-value" id="sliderValue">0%</span>
                    </div>
                    <div style="text-align:right; font-size:13px; color:#99aabb; margin-top:-8px; margin-bottom:12px;">
                        *请按住滑块，划到最右边
                    </div>

                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 查询</button>
                        <button type="reset" class="btn btn-secondary" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                    <div id="loginError" class="error-msg"></div>
                    <div class="hint">报名号前两位：12-渊迂市 · 13-华兴市 · 14-德水市</div>
                </form>
            </div>

            <!-- 录取结果展示 -->
            <div id="resultArea" class="result-area">
                <div class="result-header-top">
                    <div class="org-name">渊华德教育考试院</div>
                    <div class="org-name-en">YUANHUADE EDUCATIONAL EXAMINATION AUTHORITY</div>
                    <div class="title-main" id="cityTitle">2026年渊迂市高中阶段学校招生录取结果查询</div>
                </div>

                <div class="info-row">
                    <div class="info-item"><strong>姓名：</strong><span id="displayName">--</span></div>
                    <div class="info-item"><strong>报名号：</strong><span id="displayId">--</span></div>
                    <span class="city-badge" id="cityBadge">渊迂市</span>
                </div>

                <div id="resultContent">
                    <!-- 动态显示录取结果 -->
                </div>

                <div class="result-footer">
                    <div class="stamp">
                        <i class="fas fa-stamp"></i> 录取专用章 · 渊华德教育考试院
                    </div>
                    <div class="actions no-print">
                        <button class="btn-sm btn-outline" id="backBtn"><i class="fas fa-arrow-left"></i> 返回查询</button>
                        <button class="btn-sm btn-gold" id="printBtn"><i class="fas fa-print"></i> 打印</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM =====
            const loginArea = document.getElementById('loginArea');
            const resultArea = document.getElementById('resultArea');
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginError = document.getElementById('loginError');
            const slider = document.getElementById('slider');
            const sliderValue = document.getElementById('sliderValue');
            const resetBtn = document.getElementById('resetBtn');
            const backBtn = document.getElementById('backBtn');
            const printBtn = document.getElementById('printBtn');

            const displayName = document.getElementById('displayName');
            const displayId = document.getElementById('displayId');
            const cityBadge = document.getElementById('cityBadge');
            const cityTitle = document.getElementById('cityTitle');
            const resultContent = document.getElementById('resultContent');

            // ===== 滑块 =====
            slider.addEventListener('input', function() {
                sliderValue.textContent = this.value + '%';
                if (this.value == 100) {
                    this.style.background = '#27ae60';
                } else {
                    this.style.background = '#d0d8e0';
                }
            });

            resetBtn.addEventListener('click', function() {
                loginError.textContent = '';
                slider.value = 0;
                sliderValue.textContent = '0%';
                slider.style.background = '#d0d8e0';
            });

            // ===== 数据 =====
            let allUsers = [];
            let allAdmissions = [];
            let allSchools = [];

            // 招生类别映射
            const categoryMap = {
                '1': '名额分配到区',
                '2': '名额分配到校',
                '3': '统一招生志愿',
                '4': '自主招生'
            };

            // ===== 加载 account.json =====
            async function loadAccounts() {
                try {
                    const res = await fetch('account.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allUsers = data.users || [];
                    console.log('✅ 账户数据加载成功');
                } catch (err) {
                    console.warn('⚠️ 加载 account.json 失败，使用模拟数据。', err);
                    allUsers = [
                        { "报名号": "12260101", "密码": "123456", "姓名": "张渊", "城市": "渊迂市" },
                        { "报名号": "13260001", "密码": "123456", "姓名": "李华", "城市": "华兴市" },
                        { "报名号": "14260001", "密码": "123456", "姓名": "王德", "城市": "德水市" }
                    ];
                }
            }

            // ===== 加载 service-yhdmeea-admission.json =====
            async function loadAdmissions() {
                try {
                    const res = await fetch('service-yhdmeea-admission.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allAdmissions = data.admissions || [];
                    console.log('✅ 录取数据加载成功');
                } catch (err) {
                    console.warn('⚠️ 加载 service-yhdmeea-admission.json 失败，使用模拟数据。', err);
                    allAdmissions = [
                        { "报名号": "12260101", "学校代码": "120101", "招生类别": "2" },
                        { "报名号": "13260001", "学校代码": "120102", "招生类别": "3" },
                        { "报名号": "14260001", "学校代码": "120103", "招生类别": "1" }
                    ];
                }
            }

            // ===== 加载 schools_yuanyu.json =====
            async function loadSchools() {
                try {
                    const res = await fetch('schools_yuanyu.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allSchools = data.schools || [];
                    console.log('✅ 学校数据加载成功');
                } catch (err) {
                    console.warn('⚠️ 加载 schools_yuanyu.json 失败，使用模拟数据。', err);
                    allSchools = [
                        { "id": "120101", "name": "渊迂市渊迂中学" },
                        { "id": "120102", "name": "渊迂大学附属中学" },
                        { "id": "120103", "name": "渊迂师范大学附属中学" }
                    ];
                }
            }

            // ===== 城市识别 =====
            function getCityFromId(报名号) {
                const prefix = 报名号.substring(0, 2);
                if (prefix === '12') return '渊迂市';
                else if (prefix === '13') return '华兴市';
                else if (prefix === '14') return '德水市';
                else return '未知城市';
            }

            // ===== 登录 =====
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                loginError.textContent = '';

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (!username || !password) {
                    loginError.textContent = '请输入完整的报名号和密码';
                    return;
                }

                if (parseInt(slider.value, 10) < 100) {
                    loginError.textContent = '请将滑块划到最右边以验证';
                    return;
                }

                const user = allUsers.find(u => u.报名号 === username && u.密码 === password);
                if (!user) {
                    loginError.textContent = '❌ 报名号或密码错误，请重新输入';
                    return;
                }

                const city = getCityFromId(username);
                if (city !== '渊迂市') {
                    loginError.textContent = '❌ 当前仅渊迂市考生可查询录取结果，请使用渊迂市报名号';
                    return;
                }

                // 查找录取数据
                const admission = allAdmissions.find(a => a.报名号 === username);
                if (!admission) {
                    loginError.textContent = '❌ 未找到该考生的录取信息';
                    return;
                }

                // 查找学校名称
                const school = allSchools.find(s => s.id === admission.学校代码);
                const schoolName = school ? school.name : '未知学校';

                // 招生类别
                const category = categoryMap[admission.招生类别] || '未知类别';

                // 显示结果
                displayName.textContent = user.姓名;
                displayId.textContent = username;
                cityBadge.textContent = city;
                cityTitle.textContent = `2026年${city}高中阶段学校招生录取结果查询`;

                // 渲染录取结果
                resultContent.innerHTML = `
                    <div class="result-box">
                        <div class="label">录取结果</div>
                        <div class="main-result">
                            您已被 <span class="highlight">${category} - ${schoolName}</span> 录取。
                        </div>
                        <div class="sub-note">注：以收到的录取通知书为准。</div>
                    </div>
                `;

                loginArea.style.display = 'none';
                resultArea.classList.add('active');
                loginError.textContent = '';
            });

            // ===== 返回 =====
            backBtn.addEventListener('click', function() {
                resultArea.classList.remove('active');
                loginArea.style.display = 'block';
                usernameInput.value = '';
                passwordInput.value = '';
                slider.value = 0;
                sliderValue.textContent = '0%';
                slider.style.background = '#d0d8e0';
                loginError.textContent = '';
            });

            // ===== 打印 =====
            printBtn.addEventListener('click', function() {
                window.print();
            });

            // ===== 初始化 =====
            async function init() {
                await loadAccounts();
                await loadAdmissions();
                await loadSchools();
                console.log('📊 录取查询页面已加载');
            }

            init();

        })();
    </script>
</body>
</html>
